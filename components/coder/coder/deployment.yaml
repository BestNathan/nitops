apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: coder
  labels:
    app: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coder
  template:
    metadata:
      labels:
        app: coder
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - |
              until pg_isready -U coder -d coder -h postgres.coder.svc.cluster.local; do
                echo "Waiting for postgres..."
                sleep 3
              done
              echo "Postgres is ready"
      containers:
        - name: coder
          image: ghcr.io/coder/coder:latest
          env:
            - name: CODER_HTTP_ADDRESS
              value: "0.0.0.0:7080"
            - name: CODER_ACCESS_URL
              value: "https://coder.bestnathan.top"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-secret
                  key: postgres-password
            - name: CODER_PG_CONNECTION_URL
              value: "postgresql://coder:$(POSTGRES_PASSWORD)@postgres.coder.svc:5432/coder?sslmode=disable"
          ports:
            - containerPort: 7080
              name: http
          livenessProbe:
            httpGet:
              path: /api/v2
              port: 7080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v2
              port: 7080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: home
              mountPath: /home/coder
              subPath: coder/home
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: coder-nfs
