apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: coder
  labels:
    app: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coder
  template:
    metadata:
      labels:
        app: coder
    spec:
      serviceAccountName: coder
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - |
              until pg_isready -U coder -d coder -h postgres.coder.svc.cluster.local; do
                echo "Waiting for postgres..."
                sleep 3
              done
              echo "Postgres is ready"
        - name: create-cache-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /home/coder/.terraform-cache
              chown 1000:1000 /home/coder/.terraform-cache
          volumeMounts:
            - name: home
              mountPath: /home/coder
              subPath: coder/home
      containers:
        - name: coder
          image: ghcr.io/coder/coder:latest
          env:
            - name: CODER_HTTP_ADDRESS
              value: "0.0.0.0:7080"
            - name: CODER_ACCESS_URL
              value: "https://coder.bestnathan.top"
            - name: CODER_AGENT_URL
              value: "http://coder.coder.svc.cluster.local:7080"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-secret
                  key: postgres-password
            - name: CODER_PG_CONNECTION_URL
              value: "postgresql://coder:$(POSTGRES_PASSWORD)@postgres.coder.svc:5432/coder?sslmode=disable"
            - name: TF_PLUGIN_CACHE_DIR
              value: "/home/coder/.terraform-cache"
            - name: HTTP_PROXY
              value: "http://192.168.2.98:7892"
            - name: HTTPS_PROXY
              value: "http://192.168.2.98:7892"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc,.svc.cluster.local,.nhome.local,192.168.2.0/24,10.0.0.0/8"
          ports:
            - containerPort: 7080
              name: http
          livenessProbe:
            httpGet:
              path: /api/v2
              port: 7080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v2
              port: 7080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: home
              mountPath: /home/coder
              subPath: coder/home
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: coder-nfs
