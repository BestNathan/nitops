apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-proxy
  namespace: slb
  labels:
    app: nginx-proxy
spec:
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            # Nginx configs on NFS
            - name: nfs-root
              mountPath: /etc/nginx
              subPath: slb/nginx-conf
            # App TLS certs on NFS (read-only)
            - name: nfs-root
              mountPath: /etc/nginx/certs/by-app/coder
              subPath: coder/home/certs
              readOnly: true
            - name: nfs-root
              mountPath: /etc/nginx/certs/by-app/argocd
              subPath: argocd/certs
              readOnly: true
      volumes:
        - name: nfs-root
          persistentVolumeClaim:
            claimName: slb-nfs
