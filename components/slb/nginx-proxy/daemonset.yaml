apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-proxy
  namespace: slb
  labels:
    app: nginx-proxy
spec:
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              mkdir -p /etc/nginx/conf.d /etc/nginx/certs /certs/emqx /certs/nession
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            # Main nginx config from ConfigMap
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            # Site configs from ConfigMap (GitOps managed)
            - name: nginx-sites
              mountPath: /etc/nginx/conf.d
            # Default certs on NFS
            - name: nfs-root
              mountPath: /etc/nginx/certs
              subPath: slb/nginx-conf/certs
              readOnly: true
            # App TLS certs via NFS subPath (read-only)
            - name: nfs-root
              mountPath: /etc/nginx/certs/by-app/coder
              subPath: coder/home/certs
              readOnly: true
            - name: nfs-root
              mountPath: /etc/nginx/certs/by-app/argocd
              subPath: argocd/certs
              readOnly: true
            # EMQX TLS certs — direct PVC mount (no subPath), certs live at /mnt/share/k8s/emqx/certs/
            - name: emqx-certs
              mountPath: /certs/emqx
              readOnly: true
            # Nession TLS certs — subPath from slb-nfs PVC
            - name: nfs-root
              mountPath: /certs/nession
              subPath: nession/certs
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
        - name: nginx-sites
          configMap:
            name: nginx-sites
        - name: nfs-root
          persistentVolumeClaim:
            claimName: slb-nfs
        - name: emqx-certs
          persistentVolumeClaim:
            claimName: emqx-certs
