apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-proxy
  namespace: slb
  labels:
    app: nginx-proxy
spec:
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      shareProcessNamespace: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: docker.io/library/nginx@sha256:2f4e10193b0c4f61472245e9d26cea78e7df7af266c7e7cf5e67353ee2731b51
          command:
            - sh
            - -c
            - |
              mkdir -p /etc/nginx/conf.d /etc/nginx/certs
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            # Main nginx config from ConfigMap
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            # Site configs from ConfigMap (GitOps managed)
            - name: nginx-sites
              mountPath: /etc/nginx/conf.d
            # Default TLS cert on NFS
            - name: nfs-root
              mountPath: /etc/nginx/certs
              subPath: slb/nginx-conf/certs
              readOnly: true
            - name: bestnathan-tls
              mountPath: /etc/nginx/certs-managed/bestnathan
              readOnly: true
            - name: nginx-run
              mountPath: /var/run
        - name: cert-reloader
          image: docker.io/library/nginx@sha256:2f4e10193b0c4f61472245e9d26cea78e7df7af266c7e7cf5e67353ee2731b51
          command: ["/bin/sh", "/usr/local/bin/cert-reloader.sh"]
          env:
            - name: PROBE_HOST
              value: argocd.bestnathan.top
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-sites
              mountPath: /etc/nginx/conf.d
            - name: nfs-root
              mountPath: /etc/nginx/certs
              subPath: slb/nginx-conf/certs
              readOnly: true
            - name: bestnathan-tls
              mountPath: /etc/nginx/certs-managed/bestnathan
              readOnly: true
            - name: nginx-run
              mountPath: /var/run
            - name: reloader-script
              mountPath: /usr/local/bin/cert-reloader.sh
              subPath: cert-reloader.sh
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
        - name: nginx-sites
          configMap:
            name: nginx-sites
        - name: nfs-root
          persistentVolumeClaim:
            claimName: slb-nfs
        - name: bestnathan-tls
          secret:
            secretName: bestnathan-top-tls
            defaultMode: 0400
        - name: nginx-run
          emptyDir: {}
        - name: reloader-script
          configMap:
            name: nginx-reloader-script
            defaultMode: 0555
