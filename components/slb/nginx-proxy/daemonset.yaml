apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-proxy
  namespace: slb
  labels:
    app: nginx-proxy
spec:
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
      annotations:
        checksum/slb-reloader: "a485684901ed2dab1a14e9edee32f7a01e669bc495094d5aaffef889882bc9d1"
        # Rolls the DaemonSet when the served site configuration changes: nginx
        # does not reload on a mounted ConfigMap edit by itself, and the
        # cert-reloader only reloads on certificate rotation.
        # sha256 of components/slb/nginx-proxy/configmap-sites.yaml —
        # tests/slb/test-sites-contract.sh fails when these drift apart.
        checksum/nginx-sites: "5f9cee6dffecd0162c2bbc4d2397d8b53129b95ef16687ce2533d9d7b60e545d"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      shareProcessNamespace: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: docker.io/library/nginx@sha256:2f4e10193b0c4f61472245e9d26cea78e7df7af266c7e7cf5e67353ee2731b51
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /etc/nginx/conf.d /etc/nginx/certs
              STATE_DIR=/etc/nginx/certs-active
              mkdir -p "$STATE_DIR/generations"
              if [ ! -e "$STATE_DIR/current/tls.crt" ]; then
                mkdir -p "$STATE_DIR/generations/bootstrap-nfs"
                cp /etc/nginx/certs/bestnathan.crt "$STATE_DIR/generations/bootstrap-nfs/tls.crt"
                cp /etc/nginx/certs/bestnathan.key "$STATE_DIR/generations/bootstrap-nfs/tls.key"
                chmod 644 "$STATE_DIR/generations/bootstrap-nfs/tls.crt"
                chmod 600 "$STATE_DIR/generations/bootstrap-nfs/tls.key"
                ln -sfn generations/bootstrap-nfs "$STATE_DIR/current"
              fi
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-sites
              mountPath: /etc/nginx/conf.d
            - name: nfs-root
              mountPath: /etc/nginx/certs
              subPath: slb/nginx-conf/certs
              readOnly: true
            - name: certs-active
              mountPath: /etc/nginx/certs-active
            - name: nginx-run
              mountPath: /var/run
        - name: cert-reloader
          image: docker.io/library/nginx@sha256:2f4e10193b0c4f61472245e9d26cea78e7df7af266c7e7cf5e67353ee2731b51
          command: ["/bin/sh", "/usr/local/share/cert-reloader/cert-reloader.sh"]
          env:
            - name: PROBE_HOST
              value: argocd.bestnathan.top
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-sites
              mountPath: /etc/nginx/conf.d
            - name: nfs-root
              mountPath: /etc/nginx/certs
              subPath: slb/nginx-conf/certs
              readOnly: true
            - name: bestnathan-tls
              mountPath: /etc/nginx/certs-managed/bestnathan
              readOnly: true
            - name: certs-active
              mountPath: /etc/nginx/certs-active
            - name: nginx-run
              mountPath: /var/run
            - name: reloader-script
              mountPath: /usr/local/share/cert-reloader
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
        - name: nginx-sites
          configMap:
            name: nginx-sites
        - name: nfs-root
          persistentVolumeClaim:
            claimName: slb-nfs
        - name: bestnathan-tls
          secret:
            secretName: bestnathan-top-tls
            optional: true
            defaultMode: 0400
        - name: certs-active
          emptyDir:
            medium: Memory
        - name: nginx-run
          emptyDir: {}
        - name: reloader-script
          configMap:
            name: nginx-reloader-script
            defaultMode: 0555
