apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-proxy
  namespace: slb
  labels:
    app: nginx-proxy
spec:
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              mkdir -p /etc/nginx/conf.d /etc/nginx/certs
              exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            # Main nginx config from ConfigMap
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            # Site configs from ConfigMap (GitOps managed)
            - name: nginx-sites
              mountPath: /etc/nginx/conf.d
            # Default TLS cert on NFS
            - name: nfs-root
              mountPath: /etc/nginx/certs
              subPath: slb/nginx-conf/certs
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
        - name: nginx-sites
          configMap:
            name: nginx-sites
        - name: nfs-root
          persistentVolumeClaim:
            claimName: slb-nfs
