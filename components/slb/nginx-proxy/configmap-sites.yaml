apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-sites
  namespace: slb
  labels:
    app: nginx-proxy
data:
  # All traffic → Higress. TLS terminated with wildcard certs via SNI.
  00-catch-all.conf: |
    server {
      listen 80 default_server;
      server_name _;

      location / {
        proxy_pass http://higress-gateway.higress-system.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
    }

    # Internal domains
    server {
      listen 443 ssl;
      server_name *.nhome.local;

      ssl_certificate     /etc/nginx/certs/nhome.crt;
      ssl_certificate_key /etc/nginx/certs/nhome.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      location / {
        proxy_pass http://higress-gateway.higress-system.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
    }

    # Public domains
    server {
      listen 443 ssl;
      server_name *.bestnathan.top;

      ssl_certificate     /etc/nginx/certs/bestnathan.crt;
      ssl_certificate_key /etc/nginx/certs/bestnathan.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      location / {
        proxy_pass http://higress-gateway.higress-system.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
    }

    # Fallback — multi-level wildcards (*.vol.bestnathan.top, *.nession.nhome.local, etc.)
    server {
      listen 443 ssl default_server;
      server_name _;

      ssl_certificate     /etc/nginx/certs/default.crt;
      ssl_certificate_key /etc/nginx/certs/default.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      location / {
        proxy_pass http://higress-gateway.higress-system.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }
    }
