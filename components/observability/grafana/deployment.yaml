apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
        - name: copy-tdengine-plugin
          image: tdengine/tdengine:3.3.6.13
          command:
            - sh
            - -c
            - |
              cp /usr/local/taos/bin/tdengine-datasource.zip /tmp/plugins/tdengine-datasource.zip
              echo "TDengine plugin zip copied"
          volumeMounts:
            - name: plugins-tmp
              mountPath: /tmp/plugins
        - name: extract-plugin
          image: busybox:stable
          command:
            - sh
            - -c
            - |
              PLUGIN_DIR=/var/lib/grafana/plugins/tdengine-datasource
              if [ -f "$PLUGIN_DIR/plugin.json" ]; then
                echo "TDengine plugin already installed, skipping"
                exit 0
              fi
              echo "Extracting TDengine Grafana plugin..."
              mkdir -p "$PLUGIN_DIR"
              unzip -qo /tmp/plugins/tdengine-datasource.zip -d "$PLUGIN_DIR"
              echo "Plugin installed to $PLUGIN_DIR"
          volumeMounts:
            - name: plugins-tmp
              mountPath: /tmp/plugins
            - name: data
              mountPath: /var/lib/grafana
              subPath: grafana
        - name: install-infinity-plugin
          image: busybox:stable
          command:
            - sh
            - -c
            - |
              ARCH=$(uname -m)
              case "$ARCH" in
                x86_64)  PLUGIN_ARCH=amd64 ;;
                aarch64) PLUGIN_ARCH=arm64 ;;
                *)       echo "ERROR: unsupported arch $ARCH"; exit 1 ;;
              esac

              PLUGIN_DIR=/var/lib/grafana/plugins/yesoreyeram-infinity-datasource
              CACHE_DIR=/var/lib/grafana/plugin-cache
              ZIP_FILE="infinity-${PLUGIN_ARCH}.zip"
              ZIP_PATH="${CACHE_DIR}/${ZIP_FILE}"
              BINARY="gpx_infinity_linux_${PLUGIN_ARCH}"

              # Already installed for current arch? Skip
              if [ -f "$PLUGIN_DIR/plugin.json" ] && [ -f "$PLUGIN_DIR/$BINARY" ]; then
                echo "Infinity plugin (${PLUGIN_ARCH}) already installed, skipping"
                exit 0
              fi

              echo "Infinity plugin needs install/update for arch ${PLUGIN_ARCH}"

              # Download to NFS cache if not already cached
              mkdir -p "$CACHE_DIR"
              if [ ! -f "$ZIP_PATH" ]; then
                URL="https://grafana.com/api/plugins/yesoreyeram-infinity-datasource/versions/3.10.1/download?os=linux&arch=${PLUGIN_ARCH}"
                echo "Downloading Infinity plugin (${PLUGIN_ARCH}) to NFS cache..."
                wget -q -O "$ZIP_PATH" "$URL"
                echo "Cached: $ZIP_PATH"
              else
                echo "Using cached: $ZIP_PATH"
              fi

              # Extract from cache
              mkdir -p "$PLUGIN_DIR"
              unzip -qo "$ZIP_PATH" -d /var/lib/grafana/plugins/
              echo "Infinity plugin (${PLUGIN_ARCH}) installed"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
              subPath: grafana
      containers:
        - name: grafana
          image: grafana/grafana-enterprise:13.1.0-25196703233
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: JAEGER_AGENT_PORT
              value: ""
            - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
              value: "tdengine-datasource,yesoreyeram-infinity-datasource"
            - name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
              subPath: grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-tdengine
              mountPath: /etc/grafana/provisioning/dashboards/tdengine
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "250m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shared-nfs
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-tdengine
          configMap:
            name: grafana-dashboards-tdengine
        - name: plugins-tmp
          emptyDir: {}
