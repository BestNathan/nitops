apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-emqx
  namespace: observability
  labels:
    app: grafana
data:
  emqx.yaml: |
    apiVersion: 1
    providers:
      - name: EMQX
        folder: EMQX
        type: file
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/emqx
  emqx-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["emqx", "mqtt"],
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "EMQX Overview",
      "uid": "emqx-overview",
      "version": 1,
      "templating": {
        "list": [
          {
            "name": "emqx_cluster",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "Prometheus" },
            "query": "label_values(emqx_connections_count, emqx_cluster)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": { "text": "All", "value": "$__all" },
            "refresh": 1,
            "label": "Cluster"
          },
          {
            "name": "instance",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "Prometheus" },
            "query": "label_values(emqx_connections_count{emqx_cluster=~\"$emqx_cluster\"}, instance)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": { "text": "All", "value": "$__all" },
            "refresh": 1,
            "label": "Instance"
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Overview",
          "type": "row"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(emqx_connections_count{emqx_cluster=~\"$emqx_cluster\", instance=~\"$instance\"})",
              "refId": "A"
            }
          ],
          "title": "Connections",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 3, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(emqx_live_connections_count{emqx_cluster=~\"$emqx_cluster\", instance=~\"$instance\"})",
              "refId": "A"
            }
          ],
          "title": "Live Connections",
          "type": "stat"
        },
        {
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
