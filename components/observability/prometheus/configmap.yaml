apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector:8889"]
      - job_name: "emqx-prod"
        metrics_path: "/api/v5/prometheus/stats"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - emqx
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: emqx
          - source_labels: [__meta_kubernetes_pod_label_cluster]
            action: keep
            regex: emqx-prod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: __address__
            replacement: "${1}.emqx-prod-headless.emqx.svc.cluster.local:18083"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_label_cluster]
            target_label: emqx_cluster
      - job_name: "emqx-k8s-prod"
        metrics_path: "/api/v5/prometheus/stats"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - emqx
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: emqx
          - source_labels: [__meta_kubernetes_pod_label_cluster]
            action: keep
            regex: k8s-prod
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: __address__
            replacement: "${1}.emqx-headless.emqx.svc.cluster.local:18083"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_label_cluster]
            target_label: emqx_cluster
      - job_name: "cert-manager"
        static_configs:
          - targets: ["cert-manager.cert-manager.svc:9402"]
      - job_name: "blackbox-lan-slb"
        metrics_path: /probe
        params:
          module: [lan_slb_https]
        static_configs:
          - targets:
              - https://192.168.2.162/
              - https://192.168.2.86/
              - https://192.168.2.232/
              - https://192.168.2.224/
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.observability.svc:9115
