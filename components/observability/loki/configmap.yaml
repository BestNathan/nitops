apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
  labels:
    app: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        s3:
          endpoint: minio.minio.svc:9000
          access_key_id: admin
          secret_access_key: minioadmin
          insecure: true
          s3forcepathstyle: true
          bucketnames: loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        # Legacy schema for historical data
        - from: "2020-10-24"
          store: boltdb-shipper
          object_store: s3
          schema: v11
          index:
            prefix: index_
            period: 24h
        # New schema for native OTLP ingestion with structured metadata
        - from: "2026-05-07"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      otlp_config:
        log_attributes:
          - action: index_label
            attributes:
              - agent_type
              - agent_model
