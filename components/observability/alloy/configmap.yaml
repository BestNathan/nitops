apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
  labels:
    app: alloy
data:
  config.alloy: |
    // ==============================================
    // Kubernetes Service Discovery
    // ==============================================
    discovery.kubernetes "pods" {
        role = "pod"
    }

    // Filter pods to only this node + add useful stream labels
    discovery.relabel "local_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
            action = "keep"
            source_labels = ["__meta_kubernetes_pod_node_name"]
            regex = sys.env("HOSTNAME")
        }
        rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
        }
        rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label = "app"
        }
        rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label = "container"
        }
    }

    discovery.kubernetes "nodes" {
        role = "node"
    }

    // Filter to only this node for kubelet scrape
    discovery.relabel "local_node" {
        targets = discovery.kubernetes.nodes.targets

        rule {
            action = "keep"
            source_labels = ["__meta_kubernetes_node_name"]
            regex = sys.env("HOSTNAME")
        }
    }

    // ==============================================
    // Logs: container logs → Loki
    // ==============================================
    loki.source.kubernetes "logs" {
        targets    = discovery.relabel.local_pods.output
        forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
        endpoint {
            url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
    }

    // ==============================================
    // Metrics: kubelet → Prometheus
    // ==============================================
    prometheus.scrape "kubelet" {
        job_name          = "integrations/kubernetes/kubelet"
        honor_timestamps  = false
        targets    = discovery.relabel.local_node.output
        scheme     = "https"
        metrics_path = "/metrics"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
            insecure_skip_verify = true
        }
        forward_to = [prometheus.remote_write.default.receiver]
    }

    // ==============================================
    // Metrics: cAdvisor → Prometheus
    // ==============================================
    prometheus.scrape "cadvisor" {
        job_name          = "integrations/kubernetes/cadvisor"
        honor_timestamps  = false
        targets    = discovery.relabel.local_node.output
        scheme     = "https"
        metrics_path = "/metrics/cadvisor"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
            insecure_skip_verify = true
        }
        forward_to = [prometheus.remote_write.default.receiver]
    }

    // ==============================================
    // Remote Write: push metrics to Prometheus
    // ==============================================
    prometheus.remote_write "default" {
        endpoint {
            url = "http://prometheus.observability.svc.cluster.local:9090/api/v1/write"
        }
    }
