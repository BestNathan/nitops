apiVersion: v1
kind: Service
metadata:
  labels:
    app: tdengine-dev
    role: nginx
  name: tdengine-dev-nginx
  namespace: tdengine
spec:
  externalTrafficPolicy: Cluster
  ports:
    -
      name: tcp-rest
      nodePort: 30051
      port: 6041
      protocol: TCP
      targetPort: 6041
    -
      name: udp-native
      nodePort: 30054
      port: 6044
      protocol: UDP
      targetPort: 6044
  selector:
    app: tdengine-dev
    role: nginx
  type: NodePort
