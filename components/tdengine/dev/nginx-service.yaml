apiVersion: v1
kind: Service
metadata:
  labels:
    app: tdengine-dev
    role: nginx
  name: tdengine-dev-nginx
  namespace: tdengine
spec:
  externalTrafficPolicy: Cluster
  ports:
    - name: udp-native
      nodePort: 30054
      port: 6044
      protocol: UDP
      targetPort: 6044
  selector:
    app: tdengine-dev
    role: nginx
  type: NodePort
