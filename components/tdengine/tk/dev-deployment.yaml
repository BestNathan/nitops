apiVersion: apps/v1
kind: Deployment
metadata:
  name: taoskeeper-dev
  namespace: tdengine
  labels:
    app: tdengine-dev
    role: taoskeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdengine-dev
      role: taoskeeper
  template:
    metadata:
      labels:
        app: tdengine-dev
        role: taoskeeper
    spec:
      containers:
        - name: taoskeeper
          image: tdengine/tdengine:3.2.3.0
          command: ["taoskeeper"]
          env:
            - name: TAOS_KEEPER_TDENGINE_HOST
              value: "tdengine-dev-adapter.tdengine.svc.cluster.local"
            - name: TAOS_KEEPER_TDENGINE_PORT
              value: "6041"
            - name: TAOS_KEEPER_METRICS_DATABASE
              value: "taoskeeper_dev"
            - name: TAOS_KEEPER_LOG_LEVEL
              value: "info"
          ports:
            - containerPort: 6043
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6043
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 6043
            initialDelaySeconds: 10
            periodSeconds: 10
