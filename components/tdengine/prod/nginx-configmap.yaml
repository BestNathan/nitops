apiVersion: v1
data:
  nginx.conf: "user nginx;\nworker_processes auto;\nerror_log /var/log/nginx/error.log warn;\npid /var/run/nginx.pid;\n\nevents {\n    worker_connections 1024;\n}\n\nstream {\n    upstream taosadapter-rest {\n        server tdengine-prod-adapter.tdengine.svc.cluster.local:6041;\n    }\n    upstream taosadapter-udp {\n        server tdengine-prod-adapter.tdengine.svc.cluster.local:6044;\n    }\n\n    server {\n        listen 6041;\n        proxy_pass taosadapter-rest;\n        proxy_connect_timeout 10s;\n        proxy_timeout 300s;\n    }\n\n    server {\n        listen 6044 udp;\n        proxy_pass taosadapter-udp;\n        proxy_timeout 300s;\n    }\n}\n"
kind: ConfigMap
metadata:
  name: tdengine-prod-nginx-conf
  namespace: tdengine
