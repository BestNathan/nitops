apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tdengine-prod
    role: nginx
  name: tdengine-prod-nginx
  namespace: tdengine
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: tdengine-prod
      role: nginx
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tdengine-prod
        role: nginx
    spec:
      containers:
        -
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          name: nginx
          ports:
            -
              containerPort: 6041
              name: tcp-rest
              protocol: TCP
            -
              containerPort: 6044
              name: udp-native
              protocol: UDP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            -
              mountPath: /etc/nginx/nginx.conf
              name: nginx-conf
              subPath: nginx.conf
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        -
          configMap:
            defaultMode: 420
            name: tdengine-prod-nginx-conf
          name: nginx-conf
