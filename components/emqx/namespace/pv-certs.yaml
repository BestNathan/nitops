apiVersion: v1
kind: PersistentVolume
metadata:
  name: emqx-certs-nfs
  labels:
    app: emqx
    role: certs
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.2.105
    path: /mnt/share/k8s/emqx/certs
  storageClassName: nfs
  volumeMode: Filesystem
