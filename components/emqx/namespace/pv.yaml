apiVersion: v1
kind: PersistentVolume
metadata:
  name: emqx-nfs
  labels:
    app: emqx
    role: data
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    path: /mnt/share/emqx
    server: 192.168.2.105
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  volumeMode: Filesystem
