apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  namespace: emqx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emqx
  serviceName: emqx-headless
  template:
    metadata:
      labels:
        app: emqx
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker2
              weight: 100
      initContainers:
        - name: init-certs
          image: nginx:alpine
          command:
            - sh
            - -c
            - |
              mkdir -p /data/certs
              if [ ! -f /data/certs/emqx.crt ]; then
                echo "Generating self-signed TLS certificates..."
                apk add --no-cache openssl > /dev/null 2>&1
                openssl req -x509 -newkey rsa:2048 -nodes \
                  -keyout /data/certs/emqx.key -out /data/certs/emqx.crt -days 3650 \
                  -subj "/CN=emqx.bestnathan.top" \
                  -addext "subjectAltName=DNS:emqx.nhome.local,DNS:emqx.bestnathan.top"
                openssl req -x509 -newkey rsa:2048 -nodes \
                  -keyout /data/certs/mqtt.key -out /data/certs/mqtt.crt -days 3650 \
                  -subj "/CN=mqtt.bestnathan.top" \
                  -addext "subjectAltName=DNS:mqtt.nhome.local,DNS:mqtt.bestnathan.top"
                echo "Certificates generated."
              else
                echo "Certificates already exist, skipping generation."
              fi
              ls -la /data/certs/
          volumeMounts:
            - name: emqx-data
              mountPath: /data
              subPath: k8s-prod/data
      containers:
        - name: emqx
          image: emqx/emqx:5.8.4
          env:
            - name: EMQX_NODE__NAME
              value: emqx@node.emqx.k8s
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 8083
              name: ws
            - containerPort: 8084
              name: wss
            - containerPort: 8883
              name: mqtts
            - containerPort: 18083
              name: dashboard
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: emqx-data
              mountPath: /opt/emqx/data
              subPath: k8s-prod/data
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: emqx-data
          persistentVolumeClaim:
            claimName: emqx-data
