apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: new-api
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          args:
            - redis-server
            - --requirepass
            - "123456"
          ports:
            - containerPort: 6379
              name: redis
