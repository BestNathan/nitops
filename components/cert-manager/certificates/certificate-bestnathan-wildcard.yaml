apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bestnathan-wildcard
  namespace: slb
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretName: bestnathan-top-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "*.bestnathan.top"
  privateKey:
    rotationPolicy: Always
