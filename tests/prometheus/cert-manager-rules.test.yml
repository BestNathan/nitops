rule_files:
  - /etc/prometheus/rules/cert-manager.yml

evaluation_interval: 15s

group_eval_order:
  - cert-manager
  - edge-tls-lan

tests:
  - interval: 15s
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="slb",name="bestnathan-wildcard"}'
        values: "0x120"
    alert_rule_test:
      - alertname: CertManagerCertificateExpiring
        eval_time: 30m
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'probe_success{job="blackbox-lan-slb",instance="https://192.168.2.86/"}'
        values: "0x120"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-lan-slb",instance="https://192.168.2.86/"}'
        values: "0x120"
    alert_rule_test:
      - alertname: LanSlbTlsProbeFailed
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-lan-slb
              instance: https://192.168.2.86/
            exp_annotations:
              summary: LAN SLB HTTPS probe fails with normal trust verification
      - alertname: LanSlbCertificateExpiring
        eval_time: 30m
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'up{job="cert-manager",instance="cert-manager.cert-manager.svc:9402"}'
        values: "0x30"
    alert_rule_test:
      - alertname: CertManagerScrapeDown
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              severity: critical
              job: cert-manager
              instance: cert-manager.cert-manager.svc:9402
            exp_annotations:
              summary: Prometheus cannot scrape cert-manager
